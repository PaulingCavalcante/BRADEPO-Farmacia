server.port=8080

# ===== Datasource MySQL =====
# Banco e tabelas são criados automaticamente no primeiro boot:
#  - createDatabaseIfNotExist=true  -> o connector MySQL cria o schema "farmacia" se não existir
#  - spring.jpa.hibernate.ddl-auto=update -> o Hibernate cria/atualiza as tabelas
# Pré-requisito: servidor MySQL rodando + usuário com privilégio de CREATE.
# Credenciais: default de dev root/root; sobrescreva por variável de ambiente DB_USER/DB_PASS.
spring.datasource.url=jdbc:mysql://localhost:3306/farmacia?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Seed (data.sql) =====
# sql.init.mode=always -> roda data.sql também em banco não-embarcado (MySQL).
# defer-datasource-initialization=true -> data.sql roda DEPOIS do Hibernate criar as tabelas.
# O data.sql usa INSERT IGNORE, então é idempotente (não duplica a cada boot).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===== RabbitMQ =====
# Credenciais: default guest/guest do broker local; sobrescreva por variável de ambiente.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
# Sem broker: a aplicação sobe e as vendas funcionam; eventos são descartados com aviso no log.
spring.rabbitmq.connection-timeout=2000
spring.rabbitmq.listener.simple.missing-queues-fatal=false
