server.port=8080

# ===== Datasource MySQL =====
# Banco e tabelas são criados automaticamente no primeiro boot:
#  - createDatabaseIfNotExist=true  -> o connector MySQL cria o schema "farmacia" se não existir
#  - spring.jpa.hibernate.ddl-auto=update -> o Hibernate cria/atualiza as tabelas
# Pré-requisito: servidor MySQL rodando + usuário com privilégio de CREATE.
# Credenciais: default de dev root/root; sobrescreva por variável de ambiente DB_USER/DB_PASS.
spring.datasource.url=jdbc:mysql://localhost:3306/farmacia?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
